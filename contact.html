<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - WorkFlow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <nav class="navbar">

            <div class="logo">
                <h2>🚀 WorkFlow</h2>
            </div>

            <ul class="menu">
                <li><a href="index.html">🏠 Accueil</a></li>
                <li><a href="favoris.html">⭐ Favoris</a></li>
                <li><a href="apropos.html">ℹ️ À propos</a></li>
                <li><a href="parametres.html">⚙️ Paramètres</a></li>
                <li><a href="contact.html">📞 Contact</a></li>
            </ul>

        </nav>

    </header>

    <main>

        <section class="apropos">

            <h1>📞 Contact</h1>

            <p>
                Merci d'utiliser WorkFlow.
            </p>

            <p>
                Une question, une suggestion ou un problème ?
                N'hésitez pas à nous écrire.
            </p>

            <form>

                <input
                    type="text"
                    placeholder="Votre nom"
                    required
                >

                <br><br>

                <input
                    type="email"
                    placeholder="Votre e-mail"
                    required
                >

                <br><br>

                <textarea
                    rows="6"
                    cols="40"
                    placeholder="Votre message..."
                    required
                ></textarea>

                <br><br>

                <button type="submit">
                    📩 Envoyer
                </button>

            </form>

        </section>

    </main>

    <footer>

        <p>
            © 2026 WorkFlow - Tous droits réservés.
        </p>

    </footer>

</body>

</html>
