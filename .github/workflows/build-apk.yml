name: Build WorkFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Installer Capacitor Android
        run: npm install @capacitor/android@7.6.8

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer les fichiers du site
        run: |
          mkdir -p www
          rsync -av ./ www/ \
            --exclude=www \
            --exclude=android \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=package.json \
            --exclude=package-lock.json \
            --exclude=capacitor.config.json

      - name: Ajouter Android
        run: npx cap add android

      - name: Synchroniser
        run: npx cap sync android

      - name: Construire APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Récupérer APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkFlow-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
